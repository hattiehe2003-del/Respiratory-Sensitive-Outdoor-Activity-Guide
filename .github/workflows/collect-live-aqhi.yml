name: Collect live AQHI

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
      timezone: "Asia/Hong_Kong"

permissions:
  contents: write

concurrency:
  group: collect-live-aqhi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-collector.txt

      - name: Collect and validate one official snapshot
        run: python scripts/collect_live_aqhi.py

      - name: Commit a new or revised official snapshot
        shell: bash
        run: |
          git add data/live/aqhi_rolling.csv data/live/status.json data/live/latest_24aqhi_Eng.xml
          if git diff --cached --quiet; then
            echo "No new or revised official AQHI data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh rolling AQHI"
          git push
