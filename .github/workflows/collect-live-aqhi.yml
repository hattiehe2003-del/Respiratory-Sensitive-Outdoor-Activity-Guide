name: Collect live AQHI

on:
  workflow_dispatch:
    inputs:
      run_prediction_demo:
        description: Run the historical 72h to 24h prediction demo
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "12,42 * * * *"
      timezone: "Asia/Hong_Kong"

permissions:
  contents: write

concurrency:
  group: collect-live-aqhi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect and validate one official snapshot
        run: python scripts/collect_live_aqhi.py

      - name: Run guarded live prediction
        run: python scripts/run_live_prediction.py

      - name: Publish live readiness
        shell: bash
        run: |
          {
            echo "## Live prediction readiness"
            echo '~~~json'
            cat data/live/prediction_status.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed live data and forecast status
        shell: bash
        run: |
          git add data/live
          if git diff --cached --quiet; then
            echo "No live data or prediction change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh rolling AQHI and forecast"
          git push

  prediction-demo:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_prediction_demo }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify existing inference path
        run: python verify_app_pipeline.py

      - name: Run 72-to-24-hour prediction demo
        run: python scripts/run_prediction_demo.py

      - name: Verify Streamlit renders generated output
        shell: bash
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py").run(timeout=60)
          assert len(app.exception) == 0, app.exception
          messages = [item.value for item in app.success]
          assert any("Latest generated demo output loaded" in message for message in messages), messages
          print("STREAMLIT_DEMO_RENDER_OK")
          PY

      - name: Smoke-test Streamlit
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit-demo.log 2>&1 &
          app_pid=$!
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill "$app_pid" || true
              echo "STREAMLIT_DEMO_OK"
              exit 0
            fi
            sleep 1
          done
          cat streamlit-demo.log
          kill "$app_pid" || true
          exit 1

      - name: Publish demo summary
        shell: bash
        run: |
          {
            echo "## Historical 72h to 24h prediction demo"
            echo '~~~json'
            cat data/processed/demo/demo_summary.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload website-ready outputs
        uses: actions/upload-artifact@v4
        with:
          name: prediction-demo-output
          path: data/processed/demo/*
          retention-days: 7
